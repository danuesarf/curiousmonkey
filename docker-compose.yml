# Curious Monkey: portal + API, scanner worker, Postgres. Three separate containers.
#   cp .env.example .env   # set SESSION_SECRET, DATA_ENCRYPTION_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
# Scale scanners without touching the UI:  docker compose up -d --scale worker=3
x-app: &app
  build: .
  image: curious-monkey:latest
  env_file: .env
  environment: &app-env
    DB_HOST: postgres
    DB_USER: cm
    DB_NAME: cm
    DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  depends_on:
    postgres: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm -d cm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Portal + API. Owns schema migrations. Never runs scans.
  app:
    <<: *app
    command: ["node", "src/server.js"]
    ports: ["${HOST_PORT:-8080}:8080"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      DB_DATA_PATH: /pgdata
    # The database volume, read-only: lets the Health page see how much disk is left under Postgres. Nothing is read from it.
    volumes: ["pgdata:/pgdata:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  # Scanner. Separate container: a slow or crashing scan cannot take the portal down.
  # Needs AWS credentials to assume the read-only scanner role in each account.
  worker:
    <<: *app
    command: ["node", "src/worker.js"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "2"
      # Node's default heap is about half the container; give it ~75% of mem_limit (keep the two in step).
      NODE_OPTIONS: "--max-old-space-size=768"
    # No published ports. Probes and metrics are on 8081 inside the network only.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 60s   # lets the running slice finish; leftovers resume on another worker
    mem_limit: 1g
    depends_on:
      app: { condition: service_healthy }   # schema exists before workers start

volumes:
  pgdata:
