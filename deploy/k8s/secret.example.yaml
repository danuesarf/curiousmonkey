# Copy to secret.yaml, fill in, and apply. Do not commit the real one.
# Better: create it from your secret manager (External Secrets, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: curious-monkey
  namespace: curious-monkey
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  # The app connects with DB_HOST/DB_USER/DB_NAME from the ConfigMap and this password (or set DATABASE_URL instead).
  DB_PASSWORD: change-me
  SESSION_SECRET: generate-with-openssl-rand-hex-32-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  DATA_ENCRYPTION_KEY: generate-with-openssl-rand-hex-32-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # OIDC_CLIENT_SECRET: ""
