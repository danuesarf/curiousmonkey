# Portal + API. Owns migrations. No AWS access needed (add a Bedrock-only role if you enable AI drafting).
apiVersion: v1
kind: ServiceAccount
metadata: { name: curious-monkey-api, namespace: curious-monkey }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: curious-monkey-api, namespace: curious-monkey }
spec:
  replicas: 2
  selector: { matchLabels: { app: curious-monkey, role: api } }
  template:
    metadata: { labels: { app: curious-monkey, role: api } }
    spec:
      serviceAccountName: curious-monkey-api
      automountServiceAccountToken: false   # it never calls the Kubernetes API
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: curious-monkey:latest        # set your registry path and a version (or digest) in kustomization.yaml
          command: [node, src/server.js]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: curious-monkey }
            - secretRef: { name: curious-monkey }
          env: [{ name: RUN_MIGRATIONS, value: "true" }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: curious-monkey, namespace: curious-monkey }
spec:
  selector: { app: curious-monkey, role: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# The portal takes traffic on 8080 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-http-only, namespace: curious-monkey }
spec:
  podSelector: { matchLabels: { role: api } }
  policyTypes: [Ingress]
  ingress: [{ ports: [{ port: 8080 }] }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curious-monkey
  namespace: curious-monkey
spec:
  # ingressClassName: nginx
  tls: [{ hosts: [curious-monkey.example.com], secretName: curious-monkey-tls }]
  rules:
    - host: curious-monkey.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: curious-monkey, port: { name: http } } } }
